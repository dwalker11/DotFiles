[general]
import = [
  "~/.config/alacritty/themes/catppuccin_mocha.toml"
]
live_config_reload = true

[env]
TERM = "xterm-256color"

[terminal]
shell = "/usr/bin/fish"

[font]
size = 10

  [font.bold]
  family = "FiraCode Nerd Font Mono SemBd"
  style = "Bold"

  [font.bold_italic]
  family = "FiraCode Nerd Font Mono"
  style = "Bold Italic"

  [font.italic]
  family = "FiraCode Nerd Font Mono"
  style = "Italic"

  [font.normal]
  family = "FiraCodeNerd Font Mono"
  style = "Regular"

[window]
dynamic_padding = true
opacity = 0.98
blur = true

  [window.padding]
  x = 4
  y = 4
